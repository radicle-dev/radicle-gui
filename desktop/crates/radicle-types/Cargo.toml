[package]
name = "radicle-types"
version = "0.1.0"
edition.workspace = true

[lib]
doctest = false

[dependencies]
anyhow = { version = "1.0.90" }
axum = { version = "0.8.1", default-features = false, features = ["json"] }
base64 = { version = "0.22.1" }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
log = { version = "0.4.22" }
infer = { version = "0.19.0" }
mime-infer = { version = "3.0.0" }
radicle = { version = "0.25", features = ["tor", "i2p"] }
radicle-artifact = { version = "0.23" }
radicle-artifact-client = { version = "0.23" }
radicle-artifact-core = { version = "0.23" }
radicle-job = { version = "0.6" }
radicle-localtime = { version = "0.1.0", features = ["serde"] }
radicle-surf = { version = "0.29.0", features = ["serde"] }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = { version = "1.0.0" }
sqlite = { version = "0.37.0", features = ["bundled"] }
ssh-key = { version = "0.6.3" }
tauri = { version = "2.11.1", features = ["isolation"] }
tauri-plugin-fs = { version = "2.5.0" }
tempfile = { version = "3.19.0" }
thiserror = { version = "2.0.12" }
ts-rs = { version = "12.0.1", features = [
    "serde-json-impl",
    "no-serde-warnings",
    "format",
] }
url = { version = "2.5.4", features = ["serde"] }
which = { version = "8.0.5" }

[dev-dependencies]
radicle = { version = "0.25", features = ["test", "tor", "i2p"] }
