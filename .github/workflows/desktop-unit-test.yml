name: desktop-unit-test
# Only desktop changes, or changes to this workflow, run it.
on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-unit-test.yml"
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-unit-test.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: desktop

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "desktop/.nvmrc"
      - run: npm ci
      - run: npm run test:unit
