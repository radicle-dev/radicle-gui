name: explorer-check
# Only explorer changes, or changes to this workflow, run it. Rust-only
# changes don't affect the web app: its tests run against a pinned, pre-built
# radicle-httpd.
on:
  push:
    paths:
      - "explorer/**"
      - "!explorer/crates/**"
      - "!explorer/Cargo.toml"
      - "!explorer/Cargo.lock"
      - "!explorer/rust-toolchain"
      - "!explorer/.cargo/**"
      - ".github/workflows/explorer-check.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: explorer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "explorer/.nvmrc"
      - run: npm ci
      - run: npm run check
