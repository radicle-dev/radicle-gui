name: explorer-unit-test
# Desktop and Rust-only changes don't affect the web app: its tests run
# against a pinned, pre-built radicle-httpd.
on:
  push:
    paths-ignore:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - ".cargo/**"
      - ".github/workflows/desktop-*.yml"
      - ".github/workflows/explorer-rust.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run test:unit
