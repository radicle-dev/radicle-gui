[advisories]
ignore = [
  "RUSTSEC-2023-0071", # https://radicle.network/nodes/oak.radicle.garden/rad:z3gqcJUoA1n9HaHKufZs5FCSGazv5/issues/bd8af7a5e3fd02c0963d7550a5cc2cab00950775
  # atomic-polyfill is unmaintained. It reaches the lockfile through
  # radicle-artifact -> postcard -> heapless 0.7, which only depends on it for
  # AVR, RISC-V, thumbv6m and Xtensa bare-metal targets, so it is never
  # compiled for any target we build. postcard 1.x pins heapless ^0.7, so this
  # can only be resolved upstream.
  "RUSTSEC-2023-0089",
  # crypto-bigint 0.5 reaches the lockfile through radicle-crypto ->
  # ssh-agent-lib -> ssh-key -> p256. Radicle uses Ed25519 only, so the p256
  # code path is never entered. The fix is in 0.7, but p256 pins crypto-bigint
  # ^0.5, so a lockfile update cannot apply it.
  "RUSTSEC-2026-0387",
]
