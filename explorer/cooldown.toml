[cooldown]
incompatible-publish-age = "deny"
# `floor` keeps initial Cargo.lock versions as the minimum; `ignore` allows
# lower versions.
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "7 days"
# Taken before the cooldown to fix RUSTSEC-2026-0391, RUSTSEC-2026-0395 to
# RUSTSEC-2026-0406. Reviewed against upstream; remove
# once they are 7 days old (2026-11-08).
[[allow.exact]]
crate = "zstd"
version = "0.13.4"

[[allow.exact]]
crate = "zstd-safe"
version = "7.4.0"
