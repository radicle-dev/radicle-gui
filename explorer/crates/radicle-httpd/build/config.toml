[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "codegen-units=1",
    "-C", "incremental=false",
    "-C", "opt-level=3",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "codegen-units=1",
    "-C", "incremental=false",
    "-C", "opt-level=3",
]

# Several crates link the same libraries and frameworks on Apple targets, so
# `rustc` passes them more than once. Apple's `ld` deduplicates, but Zig does
# not, and emits duplicate `LC_LOAD_DYLIB` commands, e.g. for CoreFoundation.
# `dyld` on macOS 26 refuses to load such a binary ("duplicate linked dylib"),
# while older versions tolerate it. `-dead_strip_dylibs` drops the redundant
# entries.
#
# Zig also links its own compiler_rt, which it compiles on many threads. It
# names constants there after an index that depends on the thread, e.g.
# `___anon_671098611`, so the symbol table changes from one build to the next.
# `-rtlib=none` leaves compiler_rt out: Rust's compiler_builtins and libSystem
# provide everything it did.
[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip_dylibs",
    "-C", "link-arg=-rtlib=none",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip_dylibs",
    "-C", "link-arg=-rtlib=none",
]
